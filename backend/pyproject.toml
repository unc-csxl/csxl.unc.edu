[project]
name = "csxl-backend"
version = "0.1.0"
requires-python = "~=3.11.0"
dependencies = [
    "alembic>=1.13.1,<1.14.0",
    "bs4>=0.0.2",
    "fastapi[all]>=0.115.0,<1",
    "uvicorn>=0.30,<1",
    "psycopg2>=2.9.9,<2.10.0",
    "pygithub>=2.7.0,<2.8.0",
    "pyjwt>=2.14.0,<3",
    "python-dotenv>=1.0.1,<1.1.0",
    "requests>=2.34.2,<2.35.0",
    "sqlalchemy>=2.0.30,<2.1.0",
]

[dependency-groups]
dev = [
    "honcho>=2.0.0,<3",
    "pytest>=8.2.2,<8.3.0",
    "pytest-cov>=5.0.0,<5.1.0",
    "ruff>=0.11.8,<0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true

[tool.uv]
package = false
# Security floors for transitive dependencies. Keep these until the owning
# dependencies require patched versions themselves.
constraint-dependencies = [
    "anyio>=4.14.2",
    "cryptography>=50.0.0",
    "mako>=1.3.12",
    "python-multipart>=0.0.30",
    "soupsieve>=2.8.4",
    "starlette>=1.3.1",
    "urllib3>=2.8.0",
]
