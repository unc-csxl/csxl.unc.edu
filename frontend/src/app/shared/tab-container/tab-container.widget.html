@if (localTab) {
  <mat-card class="tab-card local-tab-card">
    <nav
      mat-tab-nav-bar
      [tabPanel]="tabPanel"
      color="accent"
      aria-label="Ambassador views">
      @for (link of links; track link.path) {
        <a
          mat-tab-link
          [routerLink]="link.path"
          routerLinkActive
          #activeLink="routerLinkActive"
          [active]="!localSelected() && activeLink.isActive"
          (click)="localSelected.set(false)">
          <mat-icon class="mr-2">{{ link.icon }}</mat-icon
          >{{ link.label }}
        </a>
      }
      <button
        mat-tab-link
        [active]="localSelected()"
        (click)="localSelected.set(true)">
        <mat-icon class="mr-2">{{ localTab.icon }}</mat-icon
        >{{ localTab.label }}
      </button>
    </nav>
  </mat-card>
} @else {
  <nav mat-tab-nav-bar [tabPanel]="tabPanel" color="accent">
    <mat-card class="tab-card">
      <div class="tab-card-container">
        @for (link of links; track link.path) {
          <button
            mat-button
            [class]="
              'tab-container-button ' +
              (rla.isActive && 'tab-enabled-container-button')
            "
            [routerLink]="link.path"
            routerLinkActive
            #rla="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: false }">
            <mat-icon>{{ link.icon }}</mat-icon>
            {{ link.label }}
          </button>
        }
      </div>
    </mat-card>
  </nav>
}
<mat-tab-nav-panel #tabPanel>
  <div [hidden]="localTab && localSelected()">
    <router-outlet></router-outlet>
  </div>
  @if (localTab && localSelected()) {
    <ng-container [ngTemplateOutlet]="localContent" />
  }
</mat-tab-nav-panel>
