name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject new critical or high dependency vulnerabilities
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          license-check: false
          comment-summary-in-pr: never

  backend-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync backend dependencies
        run: uv sync --project backend --locked --group dev

      - name: Check backend formatting
        run: uv run --project backend ruff format --check backend

      - name: Check development process manager
        run: uv run --project backend honcho check

  frontend-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend lint
        working-directory: frontend
        run: pnpm lint

      - name: Audit frontend dependencies
        working-directory: frontend
        run: pnpm audit --audit-level high

      - name: Install root tooling
        run: pnpm install --frozen-lockfile

      - name: Audit root tooling
        run: pnpm audit --audit-level high

  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: csxl
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d csxl"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MODE: development
      POSTGRES_DATABASE: csxl
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      HOST: localhost
      JWT_SECRET: test-jwt-secret
      GITHUB_CLIENT_ID: test-client-id
      GITHUB_CLIENT_SECRET: test-client-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync backend dependencies
        run: uv sync --project backend --locked --group dev

      - name: Run backend tests
        run: uv run --project backend pytest backend/test

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm exec ng build --configuration production --output-path /tmp/csxl-ci-build

  production-image:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag csxl:ci .

      - name: Check runtime dependencies
        run: >-
          docker run --rm --entrypoint python csxl:ci
          -c 'import anyio, cryptography, github, jwt, multipart, starlette; print("Runtime imports passed")'
